<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>卡片预览</title>
<link rel="stylesheet" href="../css/style-kit.css" />
<link rel="stylesheet" href="../css/theme.css" />
<link rel="stylesheet" href="../css/motion.css" />
<link rel="stylesheet" href="../css/cards.css" />
<link rel="stylesheet" href="../css/card-list.css" />
<link rel="stylesheet" href="../css/card-chat.css" />
<link rel="stylesheet" href="../css/card-detail.css" />
<link rel="stylesheet" href="../css/card-settings.css" />
  <link rel="stylesheet" href="../css/components.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.5 Inter, -apple-system, "Segoe UI", system-ui, sans-serif; background: #f6f5f4; }
  /* 预览用外框：顶部一条细导航，下面是这张卡片自己的舞台 */
  #pv-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 10px; background: #fff; border-bottom: 1px solid #e6e6e6;
    font-size: 12px; color: #615d59;
  }
  #pv-bar a { color: #0075de; text-decoration: none; padding: 2px 6px; border-radius: 6px; }
  #pv-bar a:hover { background: #f0efee; }
  #pv-bar a.on { background: #0075de; color: #fff; }
  #pv-bar .sep { width: 1px; height: 14px; background: #e6e6e6; margin: 0 4px; }
  /* 舞台：每张卡都是 9:18 竖屏（用户指定 —— 宽:高 = 9:18，即 aspect-ratio 0.5） */
  #pv-stage {
    position: absolute; inset: 43px 0 0 0; display: flex; padding: 8px;
    box-sizing: border-box; justify-content: center; align-items: stretch; gap: 12px;
  }
  .pv-frame {
    flex: 0 0 auto; height: 100%; aspect-ratio: 9 / 18;
    min-width: 0; display: flex;
  }
  .pv-frame > .card { flex: 1 1 auto; min-width: 0; height: 100%; }
  /* 整排模式：三列两行，每张卡仍是严格的 9:18 竖屏 */
  #pv-stage.pv-all { flex-wrap: wrap; align-content: flex-start; overflow-y: auto; overflow-x: hidden; gap: 12px; }
  .pv-col {
    flex: 0 0 auto; width: calc((100% - 24px) / 3); height: auto;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .pv-col > .pv-tag { flex: 0 0 auto; font: 11px/1.4 ui-monospace, monospace; color: #615d59; text-align: center; }
  .pv-col > .pv-frame { flex: 0 0 auto; width: 100%; height: auto; aspect-ratio: 9 / 18; overflow: hidden; }
  /* 卡片自己不能把 9:18 的外框撑高：高度交回给外框，超出部分内部滚动 */
  .pv-frame > .card { flex: 1 1 auto; width: 100%; height: 100%; max-height: 100%; min-height: 0; overflow-y: auto; }
  #pv-err {
    margin: 8px; padding: 10px 12px; border-radius: 8px;
    background: #fff1f0; border: 1px solid #ffccc7; color: #a8071a;
    font: 12px/1.6 ui-monospace, monospace; white-space: pre-wrap;
  }
</style>
</head>
<body>
  <div id="pv-bar"></div>
  <div id="pv-stage"></div>
  <script type="module" src="./harness.js"></script>
</body>
</html>
